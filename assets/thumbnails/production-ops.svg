<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="AI 서비스 인 프로덕션 모듈 정리 썸네일">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#3b2a0d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>

  <!-- 개선 사이클: 보기 → 재기 → 고치기 → 다시 보기 -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#f4e6c8" text-anchor="middle">
    <circle cx="200" cy="92" r="58" fill="none" stroke="#5a6a8a" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="160" y="22" width="80" height="26" rx="13" fill="#f2b134"/>
    <text x="200" y="40" fill="#1f2a44" font-weight="700">기록 보기</text>
    <rect x="250" y="80" width="80" height="26" rx="13" fill="#5fd0c8"/>
    <text x="290" y="98" fill="#1f2a44" font-weight="700">숫자로 재기</text>
    <rect x="160" y="138" width="80" height="26" rx="13" fill="#e8835a"/>
    <text x="200" y="156" fill="#1f2a44" font-weight="700">한 가지 고치기</text>
    <rect x="70" y="80" width="80" height="26" rx="13" fill="#c9a227"/>
    <text x="110" y="98" fill="#1f2a44" font-weight="700">새로 확인</text>
  </g>

  <text x="30" y="206" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="21" fill="#ffffff" font-weight="700">응답은 성공했는데, 답은 틀렸다</text>
</svg>
