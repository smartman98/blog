<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="도메인 업무분해 과제 썸네일">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#0d3b3e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>

  <!-- candlestick-style bars -->
  <g stroke="#5fd0c8" stroke-width="2" opacity="0.85">
    <line x1="60" y1="70" x2="60" y2="150"/>
    <line x1="100" y1="90" x2="100" y2="170"/>
    <line x1="140" y1="50" x2="140" y2="130"/>
    <line x1="180" y1="100" x2="180" y2="190"/>
    <line x1="220" y1="60" x2="220" y2="120"/>
    <line x1="260" y1="80" x2="260" y2="160"/>
    <line x1="300" y1="40" x2="300" y2="110"/>
  </g>
  <g fill="#f2b134">
    <rect x="52" y="95" width="16" height="35" rx="2"/>
    <rect x="92" y="115" width="16" height="35" rx="2"/>
    <rect x="132" y="70" width="16" height="35" rx="2"/>
    <rect x="172" y="130" width="16" height="35" rx="2"/>
    <rect x="212" y="80" width="16" height="25" rx="2"/>
    <rect x="252" y="100" width="16" height="35" rx="2"/>
    <rect x="292" y="55" width="16" height="35" rx="2"/>
  </g>

  <text x="30" y="200" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#ffffff" font-weight="700">도메인 업무분해 과제</text>
</svg>
