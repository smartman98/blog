---
layout: page
title: 검색
permalink: /search/
---

<div class="search-box">
  <input type="text" id="search-input" placeholder="검색어를 입력하세요..." autocomplete="off">
</div>
<ul id="search-results" class="search-results"></ul>

<script>
(function () {
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var data = null;

  fetch('{{ "/search.json" | relative_url }}')
    .then(function (res) { return res.json(); })
    .then(function (json) { data = json; });

  function render(matches, query) {
    results.innerHTML = '';
    if (!query) return;
    if (matches.length === 0) {
      results.innerHTML = '<li class="search-empty">검색 결과가 없습니다.</li>';
      return;
    }
    matches.forEach(function (post) {
      var li = document.createElement('li');
      li.className = 'search-result-item';
      li.innerHTML = '<a href="' + post.url + '">' + post.title + '</a>' +
        '<span class="search-result-date">' + post.date + '</span>' +
        '<p class="search-result-excerpt">' + post.excerpt + '</p>';
      results.appendChild(li);
    });
  }

  input.addEventListener('input', function () {
    var query = input.value.trim().toLowerCase();
    if (!data || !query) { render([], query); return; }
    var matches = data.filter(function (post) {
      return post.title.toLowerCase().indexOf(query) !== -1 ||
             post.content.toLowerCase().indexOf(query) !== -1;
    });
    render(matches, query);
  });
})();
</script>
